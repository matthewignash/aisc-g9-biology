<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guided Path — Cell Biology Study Guide</title>
<link rel="stylesheet" href="css/app.css" />
<style>
  .guided-wrap { max-width: 820px; margin: 0 auto; }
  .ask { text-align: center; margin: 24px 0 32px; }
  .ask h1 { margin-bottom: 8px; }
  .ask p { color: var(--c-muted); }
  .path-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .path-card { text-align: left; cursor: pointer; border-top: 4px solid var(--c-rule); }
  .path-card:hover { border-color: var(--c-coral); }
  .path-card.coral { border-top-color: var(--c-coral); }
  .path-card.sage { border-top-color: var(--c-sage); }
  .path-card.teal { border-top-color: var(--c-teal-deep); }
  .path-card h3 { font-size: 1.15rem; }
  .path-card .tag { color: var(--c-muted); margin: 0; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: .85rem; color: var(--c-muted); margin-bottom: 20px; }
  .crumbs .step { padding: 2px 8px; border-radius: 12px; background: var(--c-pale); }
  .crumbs .step.current { background: var(--c-coral); color: #4a2c0c; font-weight: 600; }
  .crumbs .step.done { background: var(--c-sage-soft); }
  .step-actions { display: flex; gap: 12px; margin-top: 24px; }
  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 90vw); background: #fff;
    border-left: 1px solid var(--c-rule); box-shadow: -8px 0 24px rgba(0,0,0,.08); padding: 24px;
    transform: translateX(100%); transition: transform .25s; overflow-y: auto; z-index: 40; }
  .drawer.open { transform: translateX(0); }
  .drawer h3 { margin-top: 0; }
  .resume { background: var(--c-teal-soft); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .resume p { margin: 0; flex: 1; min-width: 180px; }
  .quiz-summary { text-align: center; }
  .skills-part { margin-bottom: 24px; }
  .link-btn { background: none; border: none; color: var(--c-teal-deep); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
  @media (max-width: 640px) { .path-grid, .topic-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="topbar"></div>
<div class="shell">
  <div class="guided-wrap" id="view"></div>
</div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Extra help"></div>
<script src="data/study-guide.js"></script>
<script src="js/shared.js"></script>
<script src="js/guided.js"></script>
</body>
</html>
