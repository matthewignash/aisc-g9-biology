<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reference + Quick Check — Cell Biology Study Guide</title>
<link rel="stylesheet" href="css/app.css" />
<style>
  .strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .pill { border: 1px solid var(--c-rule); background: #fff; border-radius: 20px; padding: 6px 12px; font-size: .85rem; cursor: pointer; }
  .pill.active { background: var(--c-teal-deep); color: #fff; border-color: var(--c-teal-deep); }
  .pill.done::after { content: " ✓"; color: var(--c-sage); font-weight: 700; }
  .pill.active.done::after { color: #bfe3a8; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
  .pane h2 { margin-top: 0; }
  .practice-pane { background: #fff; border: 1px solid var(--c-rule); border-radius: 12px; padding: 20px; position: sticky; top: 88px; }
  .practice-pane .eyebrow { color: var(--c-coral); }
  .practice-feedback { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: .95rem; }
  .practice-feedback.ok { background: var(--c-sage-soft); }
  .practice-feedback.no { background: #f6dde0; }
  .order-list { list-style: none; padding: 0; }
  .order-list li { border: 1px solid var(--c-rule); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; cursor: pointer; background: #fff; }
  .order-list li.picked { background: var(--c-teal-soft); border-color: var(--c-teal-deep); }
  .order-picks { min-height: 24px; font-size: .9rem; color: var(--c-muted); margin-bottom: 12px; }
  .nav-row { display: flex; justify-content: space-between; margin-top: 36px; }
  @media (max-width: 820px) { .split { grid-template-columns: 1fr; } .practice-pane { position: static; } }
</style>
</head>
<body>
<div id="topbar"></div>
<div class="shell">
  <div class="strip" id="strip" role="tablist" aria-label="Concepts"></div>
  <div class="split">
    <main class="pane" id="content"></main>
    <aside class="practice-pane" id="practice"></aside>
  </div>
  <div class="nav-row">
    <button class="btn" id="prev">← Previous</button>
    <button class="btn btn-sage" id="next" disabled>Next concept →</button>
  </div>
</div>
<script src="data/study-guide.js"></script>
<script src="js/shared.js"></script>
<script src="js/hybrid.js"></script>
</body>
</html>
